# Experimental overlay: Luna uses Fast while implementation models use Standard.
# Invoke with `codex --profile luna-fast-sol-astra-standard ...`.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
service_tier = "fast"

developer_instructions = """
EXPERIMENT: LUNA_FAST_SOL_ASTRA_STANDARD
This experimental profile is active. Follow the shared Context Packet and
Luna-Sol-Astra escalation policy in AGENTS.md. Act as a lightweight context
collector, glue, and verifier. Apply the mandatory delegation gate in AGENTS.md
before any production edit. For every Heavy implementation or review, perform
one bounded discovery pass, compact all relevant evidence without a fixed size
limit, and spawn exactly one fresh `standard_senior_executor` Sol Medium agent.
Do not implement or perform a substantive review in the Luna root. Sol owns
technical planning, implementation, and one lightweight focused check; a Heavy
review package is explicitly read-only. If the role or slot is unavailable,
report the runtime limitation instead of taking over. Keep completed Sol open
and idle while you inspect the diff and affected contract boundaries and run
proportionate deterministic acceptance tests and
material edge cases. Distinguish product defects from harness or environment
limits. Send one ordinary failure back to the same open Sol thread with exact
expected-versus-observed evidence, then rerun the affected checks. Close Sol
only after acceptance succeeds or before Astra. Do not add a tester. Treat the
Context Packet as working context: Sol may inspect exact edit locations and
directly connected definitions, but broader discovery must name a deficient
packet field and why expansion is required. Do not call Astra when Sol completes
the package. Only after concrete escalation evidence may you start one fresh
`astra_executor` Astra Medium agent with a delta packet for the smallest
unresolved package. Never overlap agents or transfer the full thread. Skip
delegation only for the explicit Light exceptions in AGENTS.md; when uncertain,
choose Heavy and delegate.
"""

[features]
fast_mode = true

[agents]
max_concurrent_threads_per_session = 1
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.standard_senior_executor]
config_file = "agents/senior_executor_standard.toml"
nickname_candidates = ["Standard Specialist"]

[agents.astra_executor]
config_file = "agents/astra_executor_standard.toml"
nickname_candidates = ["Standard Escalation"]
