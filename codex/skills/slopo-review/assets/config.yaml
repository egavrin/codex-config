# Replace the quoted path placeholders with absolute, YAML-escaped paths.
source_dir: "__SOURCE_ROOT__"
db_file: "__STATE_DIR__/slopo.db"
report_dir: "__STATE_DIR__/reports"
ignore_file: "__STATE_DIR__/ignore.txt"
agent_log_file: "__STATE_DIR__/agent.log"
embedding_model: "ollama/unclemusclez/jina-embeddings-v2-base-code:latest"
embedding_dimensions: 768
embedding_params:
  api_base: "http://127.0.0.1:11434"
# Omitted thresholds retain the pinned upstream defaults. Tests remain included.
source_dir_exclude:
  - ".git"
  - ".git/"
  - ".hg/"
  - ".svn/"
  - "node_modules/"
  - "vendor/"
  - "bower_components/"
  - ".venv/"
  - "venv/"
  - "env/"
  - "site-packages/"
  - "__pycache__/"
  - ".cache/"
  - ".pytest_cache/"
  - ".mypy_cache/"
  - ".ruff_cache/"
  - ".tox/"
  - ".nox/"
  - ".gradle/"
  - ".next/"
  - ".nuxt/"
  - ".svelte-kit/"
  - ".turbo/"
  - "dist/"
  - "build/"
  - "target/"
  - "out/"
  - "coverage/"
  - "htmlcov/"
  - "*.egg-info/"
  - "graphify-out/"
  - ".claude/worktrees/"
  - ".codex/worktrees/"
  - ".env"
  - ".env.*"
  - ".ssh/"
  - ".aws/"
  - ".azure/"
  - ".gnupg/"
  - ".config/gcloud/"
  - "credentials/"
  - "secrets/"
  - "credentials.*"
  - "secrets.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - ".npmrc"
  - ".pypirc"
  - ".netrc"
