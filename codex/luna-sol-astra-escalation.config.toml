# Experimental overlay: invoke with
# `codex --profile luna-sol-astra-escalation ...`.
# The base config remains the standard Astra Medium / Terra High route.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

developer_instructions = """
EXPERIMENT: LUNA_SOL_ASTRA_ESCALATION
This experimental profile is active. Act as lightweight glue and verifier, not
as the technical architect. Give one fresh-context Sol Medium subagent a compact
capsule containing the objective, relevant scope, material constraints, and
acceptance criteria. Sol owns technical planning and implementation. If Sol
completes the package, do not call Astra. Only after Sol finishes with concrete
escalation evidence may you start one fresh-context Astra Medium subagent for the
smallest unresolved package. Never let Sol spawn Astra, never overlap the two,
and never transfer a full thread. Inspect the combined diff and run acceptance
testing yourself. Follow the shared Luna-Sol-Astra escalation experiment policy
in AGENTS.md.
"""

[agents]
max_concurrent_threads_per_session = 1
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
