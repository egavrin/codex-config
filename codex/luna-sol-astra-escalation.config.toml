# Experimental overlay: invoke with
# `codex --profile luna-sol-astra-escalation ...`.
# The base config remains the standard Astra Medium / Terra High route.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

developer_instructions = """
EXPERIMENT: LUNA_SOL_ASTRA_ESCALATION
This experimental profile is active. Act as a lightweight context collector,
glue, and verifier, not as the technical architect. Before spawning, perform one
bounded discovery pass and assemble the Context Packet defined in AGENTS.md.
Give one fresh-context Sol Medium subagent that packet. Sol owns technical
planning, implementation, and only a lightweight focused check. Sol should use
the packet directly instead of repeating broad discovery. If Sol
completes the package, do not call Astra. Only after Sol finishes with concrete
escalation evidence may you start one fresh-context Astra Medium subagent for the
smallest unresolved package, using a delta packet rather than the full thread.
Never let Sol spawn Astra, never overlap the two, and never transfer a full
thread. Inspect the combined diff and run acceptance testing yourself. Follow
the shared Luna-Sol-Astra escalation experiment policy in AGENTS.md.
"""

[agents]
max_concurrent_threads_per_session = 1
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
