model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["/Users/egavrin/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "default"
model_verbosity = "high"
personality = "pragmatic"

developer_instructions = """
Use English for responses, agent messages, and generated technical prose.
An explicit request for another output language takes precedence.
Use the shared profile in `~/.codex/skills/writing-for-agents/references/controlled-english.md`.

EXPERIMENT: SOL_HIGH_ASTRA_MEDIUM_XHIGH
This is the only normal routing profile.
Follow the Direct/Delegated and Context Packet policies in AGENTS.md.
Direct and Delegated are orchestration routes. They are not Desktop reasoning labels.

Identify the effective root that the runtime or Desktop selected. Route by that model.
Do not infer the model from the marker name.
Treat UI overrides for root model, reasoning, and service tier as user choices.

Report their effective values.

Direct work is bounded work that the effective root can safely complete with focused operations and deterministic acceptance.
With the default Sol root, keep Direct work in Sol.
For ordinary substantial independent implementation or review, first use the Claude Opus High companion through `claude-collab`.
Use subscription authentication.
Codex owns scope, integration, patch application, and acceptance.

Stop the companion after unavailable authentication or CLI, usage limits, a supervised stall, or an incomplete bounded package.
Record the concrete fallback reason. Then, use the native model-aware branch in AGENTS.md.
For a Sol root, perform one bounded evidence pass.

Prepare a Context Packet with source provenance for exactly one fresh `astra_executor_high` Astra High owner.
Sol must not duplicate the delegated package.
Never run the companion and a native child concurrently.
Named opt-in experiments retain their selected routes and Medium roles.

High effort is not evidence of shorter latency.
Use `astra_executor_xhigh` only after Astra High returns concrete evidence of an intrinsically hard unresolved remainder.
Close High Astra before Extra High starts.
Never spawn Sol from Sol or Astra from Astra.

The effective root always owns acceptance.
Inspect the diff and affected contracts.
Run proportionate deterministic tests and material edge cases.
Distinguish product defects from harness or environment limitations.

Keep the implementation child open through acceptance.
Send at most one ordinary repair to the same owner, with concrete evidence.
A routine repair stays with its Astra High owner. It does not justify Extra High escalation.

Use no separate verifier, second opinion, overlapping child, or nested agent.

Native internal delegation uses the session's collaboration or subagent spawn mechanism.
Never automatically substitute `create_thread`, `fork_thread`, `send_message_to_thread`, or nested `codex exec`.
Create a user-visible task only after an explicit user request.
If intended delegation fails because collaboration is absent, the effective root completes the work and acceptance.

Report `effective_route = <root>-single-agent-fallback` and the concrete reason.
If collaboration exists but the exact role is absent, also report configuration drift.
Do not claim a valid delegated benchmark run in that case.
A route-owned child that temporarily occupies the only slot does not justify fallback.

Wait, reuse it, or close it as appropriate.

Report the actual root model, reasoning, and tier separately.
For the default Sol root, report the exact normal `effective_route`:
`sol-direct`, `sol-claude`, `sol-astra`, or `sol-astra-xhigh`.
Report a companion-to-native fallback and its concrete reason.
It is not a pure delegated-route benchmark.
Use `sol-single-agent-fallback` only when intended delegation failed.
Exclude fallback sessions from valid delegated-route benchmarks.
"""

[features]
multi_agent = true
fast_mode = true
js_repl = false
goals = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# V1 guard only: multi-agent V2 currently does not enforce this depth setting.
max_depth = 1
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "medium"

[agents.senior_executor_standard]
config_file = "agents/senior_executor_standard.toml"
nickname_candidates = ["Standard Specialist"]

[agents.astra_executor_standard]
config_file = "agents/astra_executor_standard.toml"
nickname_candidates = ["Astra Implementer"]

[agents.astra_executor_high]
config_file = "agents/astra_executor_high.toml"
nickname_candidates = ["Astra High Fallback"]

[agents.astra_executor_xhigh]
config_file = "agents/astra_executor_xhigh.toml"
