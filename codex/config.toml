model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["/Users/egavrin/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "fast"
model_verbosity = "high"
personality = "pragmatic"

developer_instructions = """
EXPERIMENT: TERRA_FAST_SOL_ASTRA_STANDARD
This is the sole normal routing profile. Follow the Direct/Delegated and Context
Packet policies in AGENTS.md. Direct and Delegated are orchestration routes, not
Desktop reasoning labels. Determine the actual effective root selected by the
runtime or Desktop and route by that model; do not infer it from the marker name.
Treat UI root-model, reasoning, and service-tier overrides as user choices and
report their effective values.
Direct is bounded work the effective root can safely finish with focused
operations and deterministic acceptance. Delegated is substantive work where a
distinct stronger implementation owner provides material benefit; the Astra
branch may instead use bounded Sol ownership to reduce Astra context and work.

With a Terra or Luna root, Direct work stays in the root. Delegated work requires
one bounded evidence pass, a provenance-preserving Context Packet, and exactly
one fresh `senior_executor_standard` Sol Medium owner. With a Sol root, complete
Direct and ordinary substantive implementation in Sol and never spawn another
Sol. Use `astra_executor_standard` only for a concrete intrinsically hard
unresolved remainder. With an Astra root, normally own planning, implementation,
and acceptance directly; optionally use one `senior_executor_standard` only for
a clearly bounded package that materially reduces Astra context or work, and
never spawn Astra from Astra.

The effective root always owns acceptance. Inspect the diff and affected
contracts, run proportionate deterministic tests and material edge cases, and
distinguish product defects from harness or environment limitations. Keep an
implementation child open through acceptance and send at most one evidence-rich
ordinary repair to the same owner. Close Sol before any Astra escalation. Use no
separate verifier, second opinion, overlapping child, or nested agent.

Native internal delegation means the session's collaboration or subagent spawn
mechanism. Never automatically substitute `create_thread`, `fork_thread`,
`send_message_to_thread`, or nested `codex exec`; create a user-visible task only
after an explicit user request. When intended delegation cannot occur because
collaboration is absent, the effective root finishes the work and acceptance and
reports `effective_route = <root>-single-agent-fallback` with the concrete
reason. When collaboration exists but the exact role is missing, also label
configuration drift and do not claim a valid delegated benchmark run. A route-owned child
temporarily occupying the only slot is not fallback justification: wait, reuse,
or close it as appropriate.

Report the actual root model, reasoning, and tier separately. Report the exact
normal `effective_route`: `terra-direct`, `terra-sol`, `luna-direct`, `luna-sol`,
`sol-direct`, `sol-astra`, `astra-direct`, or `astra-sol`. When Terra or Luna
actually escalates from Sol to Astra, append `-astra` to produce
`terra-sol-astra` or `luna-sol-astra`. Use the corresponding
`*-single-agent-fallback` label only when intended delegation failed. Fallback
sessions are excluded from valid delegated-route benchmarks.
"""

[features]
