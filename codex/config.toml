model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["/Users/egavrin/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "fast"
model_verbosity = "high"
personality = "pragmatic"

developer_instructions = """
EXPERIMENT: LUNA_FAST_SOL_ASTRA_STANDARD
This is the default routing profile. Follow the shared Context Packet and
Luna-Sol-Astra escalation policy in AGENTS.md. Act as a lightweight context
collector, glue, and verifier. Apply the mandatory delegation gate in AGENTS.md
before any production edit. For every Heavy implementation or review, perform
one bounded discovery pass, compact all relevant evidence without a fixed size
limit, and spawn exactly one fresh `standard_senior_executor` Sol Medium agent.
Do not implement or perform a substantive review in the Luna root. Sol owns
technical planning, implementation, and one lightweight focused check; a Heavy
review package is explicitly read-only. If the role or slot is unavailable,
report the runtime limitation instead of taking over. If Sol completes the
package, do not call Astra. Only after concrete escalation evidence may you
start one fresh `astra_executor` Astra Medium agent with a delta packet for the
smallest unresolved package. Never overlap agents or transfer the full thread.
Inspect the result and run proportionate acceptance yourself. Skip delegation
only for the explicit Light exceptions in AGENTS.md; when uncertain, choose
Heavy and delegate.
"""

[features]
multi_agent = true
fast_mode = true
js_repl = false
goals = true

[agents]
max_concurrent_threads_per_session = 1
# V1 guard only: multi-agent V2 currently does not enforce this depth setting.
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.worker]
config_file = "agents/worker.toml"
nickname_candidates = ["Builder", "Implementer"]

[agents.explorer]
config_file = "agents/explorer.toml"
nickname_candidates = ["Scout", "Mapper"]

[agents.tester]
config_file = "agents/tester.toml"
nickname_candidates = ["Verifier", "Skeptic"]

[agents.senior_executor]
config_file = "agents/senior_executor.toml"
nickname_candidates = ["Specialist"]

[agents.standard_senior_executor]
config_file = "agents/senior_executor_standard.toml"
nickname_candidates = ["Standard Specialist"]

[agents.astra_executor]
config_file = "agents/astra_executor_standard.toml"
nickname_candidates = ["Standard Escalation"]

